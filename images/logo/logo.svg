<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 168" role="img" aria-label="Light Wish Soul 光圻靈的伊夏亞">
  <title>Light Wish Soul — 光圻靈的伊夏亞</title>
  <defs>
    <linearGradient id="lws-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E8CE8A"/>
      <stop offset=".5" stop-color="#D4A843"/>
      <stop offset="1" stop-color="#B98B2E"/>
    </linearGradient>
  </defs>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&amp;family=Noto+Serif+TC:wght@500&amp;display=swap');
    .wm { font-family:'Cormorant Garamond','Times New Roman',Georgia,serif; font-weight:600; }
    .cn { font-family:'Noto Serif TC','Microsoft JhengHei',serif; font-weight:500; }
  </style>

  <!-- 圖形：細圓環 + 四芒光星（光芒／星芒，無宗教符號） -->
  <g transform="translate(20,34)">
    <circle cx="50" cy="50" r="49" fill="none" stroke="url(#lws-gold)" stroke-width="1.4"/>
    <circle cx="50" cy="50" r="41" fill="none" stroke="#D4A843" stroke-width=".5" opacity=".55"/>
    <path d="M50 12 C52.6 36 58 41.4 82 44 C58 46.6 52.6 52 50 76 C47.4 52 42 46.6 18 44 C42 41.4 47.4 36 50 12 Z"
          fill="url(#lws-gold)"/>
    <circle cx="50" cy="44" r="3.2" fill="#FFF8E7" opacity=".9"/>
  </g>

  <!-- 文字 -->
  <text class="wm" x="152" y="76" font-size="44" fill="#6F6078" letter-spacing="2.4">Light Wish Soul</text>
  <text class="cn" x="153" y="118" font-size="27" fill="#8C7899" letter-spacing="5">光圻靈的伊夏亞</text>
  <line x1="153" y1="132" x2="352" y2="132" stroke="#D4A843" stroke-width=".8" opacity=".7"/>
</svg>
