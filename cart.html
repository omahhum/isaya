<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>購物車 — 光圻靈的伊夏亞 isaya</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
</head>
<body>

<nav id="top-nav"></nav>

<div class="page">
  <section class="page-hero">
    <h1>購物車</h1>
    <p>確認品項與數量後結帳；結帳頁需以 Gmail 登入送單。</p>
  </section>

  <section class="section" style="max-width:900px;">
    <div id="cartBody"></div>
  </section>
</div>

<div id="footer-placeholder"></div>

<script src="js/auth.js"></script>
<script src="js/isaya-core.js"></script>
<script src="js/product-assets.js"></script>
<script src="js/cart.js"></script>
<script src="js/api.js"></script>
<script src="js/top-menu.js"></script>
<script src="js/auth-nav.js"></script>
<script src="js/footer.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  var body = document.getElementById('cartBody');
  ISAYA_API.loadProducts().then(function (res) { render(res); });

  function render(res) {
    if (!res || !res.ok) { // fail-closed：商品價格讀不到 → 不計價、不讓結帳
      body.innerHTML = (window.isayaFailMsg ? isayaFailMsg('購物車暫無法結帳：商品價格暫時讀不到，請稍後再試。') : '');
      return;
    }
    var d = ISAYACart.detail();
    if (!d.lines.length) {
      body.innerHTML = '<div class="cart-empty">購物車是空的。<br><br>' +
        '<a href="products.html" class="btn-gold solid" style="padding:.6rem 2rem;">去逛逛結緣品</a></div>';
      return;
    }

    var rows = d.lines.map(function (l) {
      var qtyHTML = l.multi_qty
        ? '<input class="qty-input" type="number" min="1" value="' + l.qty + '" data-q="' + l.id + '" data-o="' + l.optionId + '">'
        : '<span>1</span>';
      var totalHTML = l.consult
        ? '<span class="tag-consult">洽詢</span>'
        : '<span style="color:var(--gold);">NT$' + l.lineTotal + '</span>';
      var flags = (l.group_order ? '<span class="product-note" style="display:block;">成團後通知付款</span>' : '');
      return '<tr>' +
        '<td><strong style="color:var(--gold-soft);">' + l.name + '</strong>' +
          (l.optLabel ? '<div class="product-note">' + l.optLabel + '</div>' : '') + flags + '</td>' +
        '<td class="num">' + qtyHTML + '</td>' +
        '<td class="num">' + totalHTML + '</td>' +
        '<td class="num"><a href="#" data-rm="' + l.id + '" data-o="' + l.optionId + '" style="color:var(--text-muted);">移除</a></td>' +
      '</tr>';
    }).join('');

    var freeHint = d.goods >= ISAYA.SHIPPING.freeThreshold
      ? '<span style="color:#7fd4a0;">免運</span>'
      : (d.goods > 0 ? 'NT$' + ISAYA.SHIPPING.base : '');

    body.innerHTML =
      '<table class="cart-table"><thead><tr>' +
        '<th>品項</th><th style="text-align:center;">數量</th><th style="text-align:center;">小計</th><th></th>' +
      '</tr></thead><tbody>' + rows + '</tbody></table>' +
      '<div class="summary-box">' +
        '<div class="summary-row"><span>商品小計</span><span>NT$' + d.goods + '</span></div>' +
        '<div class="summary-row"><span>運費（滿 ' + ISAYA.SHIPPING.freeThreshold + ' 免運）</span><span>' + freeHint + '</span></div>' +
        '<div class="summary-row total"><span>合計</span><span>NT$' + d.total + '</span></div>' +
        (d.hasConsult ? '<div class="summary-note">含洽詢價項目：送單後由管理端回覆價格與檔期。</div>' : '') +
        (d.hasGroup ? '<div class="summary-note">含團印品項：成團後才通知付款，尚未需付款。</div>' : '') +
        '<div style="text-align:center;margin-top:1.5rem;">' +
          '<a href="checkout.html" class="btn-gold solid" style="padding:.7rem 3rem;">去結帳</a>' +
        '</div>' +
      '</div>';

    // 綁互動
    body.querySelectorAll('input[data-q]').forEach(function (inp) {
      inp.oninput = function () {
        var id = inp.getAttribute('data-q'), o = inp.getAttribute('data-o');
        ISAYACart.setQty(id, o, inp.value);
        setTimeout(render, 60);
      };
    });
    body.querySelectorAll('a[data-rm]').forEach(function (a) {
      a.onclick = function (e) {
        e.preventDefault();
        ISAYACart.remove(a.getAttribute('data-rm'), a.getAttribute('data-o'));
        render();
      };
    });
  }

  window.__onCartChanged = function () { render(); };
  render();
});
</script>
</body>
</html>
