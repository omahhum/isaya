<h2>詳細介紹</h2>
<div class="story-block"><p>煙供（藏傳叫煨桑、漢傳叫供香）是淨化、消除違緣、累積功德資糧的方便實用的祈福法門。</p><p>香海之名不無來由：佛經中早有香水海、香雲海，對應八供養中的燒香供養與塗香供養。</p><p>所有香粉都經過香海心咒迴向，祈請本尊加持；觀想少許煙化為無邊香雲海，雲海化現無數供品，供養諸佛菩薩及一切眾生。</p><p>隨盒附【香雲海供儀軌】電子檔，說明修法與觀想。</p><p>價格以商品頁顯示為準。</p></div>
