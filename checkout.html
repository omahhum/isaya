<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>結帳 — 光圻靈的伊夏亞 isaya</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
</head>
<body>

<nav id="top-nav"></nav>

<div class="page">
  <section class="page-hero">
    <h1>結帳</h1>
    <p>Gmail 登入後填寫收件資訊，訂單直接進入系統；「我的訂單」隨時可查付款與出貨進度。</p>
  </section>

  <section class="section" style="max-width:900px;">
    <!-- 購物車空 -->
    <div id="checkoutEmpty" class="auth-gate" style="display:none;">
      購物車是空的，先
      <a href="products.html" style="color:var(--gold);">逛逛結緣品</a>。
    </div>

    <!-- 未登入 -->
    <div id="checkoutAuth" class="auth-gate" style="display:none;">
      <p>請先用 Gmail 登入，即可送出訂單並查詢進度</p>
      <button class="btn-gold solid" style="padding:.8rem 2.4rem;" onclick="firebaseAuth.signInWithGoogle()">
        Gmail 登入
      </button>
    </div>

    <!-- 登入後：收件資訊 -->
    <div id="checkoutForm" class="form-card" style="display:none;">
      <h3 style="font-size:1.2rem;margin:0 0 1.5rem;">收件資訊</h3>
      <div class="form-group">
        <label for="coEmail">訂單帳號</label>
        <input id="coEmail" class="form-control" type="email" disabled>
        <small style="color:var(--text-muted);">訂單以此 Gmail 帳號紀錄，查詢請用同一帳號登入。</small>
      </div>
      <div class="form-group">
        <label for="coName">收件人姓名 *</label>
        <input id="coName" class="form-control" type="text" placeholder="收件人姓名">
      </div>
      <div class="form-group">
        <label for="coPhone">聯絡電話 *</label>
        <input id="coPhone" class="form-control" type="text" placeholder="例：0912345678">
      </div>
      <div class="form-group">
        <label for="coAddress">收件地址 *</label>
        <textarea id="coAddress" class="form-control" placeholder="郵遞區號與完整地址"></textarea>
      </div>
      <div class="form-group">
        <label>付款方式 *</label>
        <div class="pay-radio">
          <label><input type="radio" name="pay" value="銀行轉帳" checked> 銀行轉帳</label>
          <label><input type="radio" name="pay" value="蝦皮代付"> 蝦皮代付</label>
        </div>
      </div>
      <div class="form-group">
        <label for="coNote">備註（選填）</label>
        <textarea id="coNote" class="form-control" placeholder="加購說明、特別註記等"></textarea>
      </div>

      <div class="summary-box" id="coSummary" style="margin:1.5rem 0;"></div>

      <button id="coSubmit" class="btn-gold solid" style="width:100%;padding:.9rem;font-size:1rem;">
        送出訂單
      </button>
      <p id="coHint" style="color:var(--text-muted);font-size:.8rem;margin:.8rem 0 0;"></p>
      <p id="coBusy" style="color:var(--text-muted);font-size:.85rem;margin:1rem 0 0;display:none;">送單中，請勿重複點擊…</p>
    </div>

    <!-- 送單成功 -->
    <div id="checkoutDone" class="form-card" style="display:none;text-align:center;padding:3rem 2rem;">
      <div style="font-size:3rem;color:var(--gold);">✓</div>
      <h3 style="font-size:1.3rem;margin:1rem 0 .5rem;">訂單已送出</h3>
      <p style="color:var(--text-muted);line-height:2;">
        訂單編號：<strong id="doneOrderNo" style="color:var(--gold-soft);"></strong><br>
        目前為「先送單後付款」：管理端確認後會通知付款；付款完成再通知出貨。<br>
        出貨進度請到「我的訂單」查詢。
      </p>
      <div style="display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;margin-top:2rem;">
        <a href="orders.html" class="btn-gold solid" style="padding:.7rem 2.4rem;">查我的訂單</a>
        <a href="products.html" class="btn-outline" style="padding:.7rem 2.4rem;">繼續逛結緣品</a>
      </div>
    </div>
  </section>
</div>

<div id="footer-placeholder"></div>

<script src="js/auth.js"></script>
<script src="js/isaya-core.js"></script>
<script src="js/product-assets.js"></script>
<script src="js/cart.js"></script>
<script src="js/api.js"></script>
<script src="js/top-menu.js"></script>
<script src="js/auth-nav.js"></script>
<script src="js/footer.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  var empty = document.getElementById('checkoutEmpty');
  var authGate = document.getElementById('checkoutAuth');
  var form = document.getElementById('checkoutForm');
  var done = document.getElementById('checkoutDone');
  var hint = document.getElementById('coHint');
  var busy = document.getElementById('coBusy');

  // 等後端商品載入完再算錢（價格/庫存以試算表為唯一來源）；讀不到 → fail-closed 停用結帳
  var dataReady = false;
  ISAYA_API.loadProducts().then(function (res) { dataReady = !!(res && res.ok); renderAll(); });

  function renderAll() {
    function refreshGates() {
      var user = firebaseAuth.getCurrentUser();
      done.style.display = 'none';
      if (!dataReady) {
        // fail-closed：商品價格讀不到 → 不計價、停用結帳，絕不拿本機舊價備胎
        empty.style.display = 'block';
        empty.innerHTML = '商品資料暫無法載入，暫時無法結帳。<br><br>請稍後再試，或 <a href="products.html" style="color:var(--gold);">回結緣品總覽</a>。';
        authGate.style.display = 'none';
        form.style.display = 'none';
        return;
      }
      var hasItems = ISAYACart.detail().lines.length > 0;
      if (!hasItems) {
        empty.style.display = 'block';
        empty.innerHTML = '購物車是空的，先 <a href="products.html" style="color:var(--gold);">逛逛結緣品</a>。';
        authGate.style.display = 'none';
        form.style.display = 'none';
        return;
      }
      empty.style.display = 'none';
      if (user) {
        authGate.style.display = 'none';
        form.style.display = 'block';
        document.getElementById('coEmail').value = user.email || '';
        renderSummary();
        renderHint();
      } else {
        authGate.style.display = 'block';
        form.style.display = 'none';
      }
    }
    firebaseAuth.onAuthStateChanged(function () { refreshGates(); });
    refreshGates();

    function renderSummary() {
      var d = ISAYACart.detail();
      var el = document.getElementById('coSummary');
      if (!d.lines.length) { el.innerHTML = ''; return; }
      var rows = d.lines.map(function (l) {
        var t = l.consult ? '洽詢價' : ('NT$' + l.lineTotal);
        var q = (l.qty > 1) ? ' x' + l.qty : '';
        var opt = l.optLabel ? '（' + l.optLabel + '）' : '';
        var flag = l.group_order ? '【成團後通知付款】' : '';
        return '<div class="summary-row"><span>' + l.name + opt + q + flag + '</span><span>' + t + '</span></div>';
      }).join('');
      var freeHint = d.goods >= ISAYA.SHIPPING.freeThreshold ? '免運' : (d.goods > 0 ? 'NT$' + ISAYA.SHIPPING.base : '');
      el.innerHTML =
        rows +
        '<div class="summary-row" style="border-top:1px solid var(--line);margin-top:.4rem;padding-top:.6rem;"><span>商品小計</span><span>NT$' + d.goods + '</span></div>' +
        '<div class="summary-row"><span>運費（滿 ' + ISAYA.SHIPPING.freeThreshold + ' 免運）</span><span>' + freeHint + '</span></div>' +
        '<div class="summary-row total"><span>合計</span><span>NT$' + d.total + '</span></div>';
    }

    function renderHint() {
      var d = ISAYACart.detail();
      var parts = [];
      if (d.hasConsult) parts.push('含洽詢價項目：送單後由管理端回覆價格與檔期。');
      if (d.hasGroup) parts.push('含團印品項：成團後才通知付款。');
      hint.textContent = parts.join('');
    }

    window.__onCartChanged = function () {
      if (done.style.display === 'block') return;
      refreshGates();
    };

    document.getElementById('coSubmit').onclick = submitOrder;

    async function submitOrder() {
      var user = firebaseAuth.getCurrentUser();
      if (!user) { authGate.style.display = 'block'; form.style.display = 'none'; return; }

      var name = document.getElementById('coName').value.trim();
      var phone = document.getElementById('coPhone').value.trim();
      var address = document.getElementById('coAddress').value.trim();
      var payEl = document.querySelector('input[name="pay"]:checked');
      var pay = payEl ? payEl.value : '銀行轉帳';
      var note = document.getElementById('coNote').value.trim();

      if (!name || !phone || !address) {
        isayaToast('請先填寫姓名、電話與地址');
        return;
      }
      var d = ISAYACart.detail();
      if (!d.lines.length) { isayaToast('購物車是空的'); return; }

      var items = d.lines.map(function (l) {
        return {
          id: l.id, qty: l.qty, optionId: l.optionId,
          name: l.name, optLabel: l.optLabel,
          lineTotal: l.lineTotal, consult: !!l.consult,
          group_order: !!l.group_order, multi_qty: !!l.multi_qty
        };
      });

      busy.style.display = 'block';
      try {
        var res = await firebaseAuth.createOrder({
          name: name, phone: phone, address: address,
          pay_method: pay, note: note,
          items: items,
          total: d.total, shipping: d.shipping
        });
        ISAYACart.clear();
        document.getElementById('doneOrderNo').textContent = res.order_no || '';
        done.style.display = 'block';
        window.scrollTo(0, 0);
      } catch (e) {
        isayaToast('送單失敗：' + (e.message || '請稍後再試'));
      } finally {
        busy.style.display = 'none';
      }
    }
  }
});
</script>
</body>
</html>
