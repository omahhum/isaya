<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>商品 — 光圻靈的伊夏亞 isaya</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
</head>
<body>

<nav id="top-nav"></nav>

<div class="page">
  <div class="section" style="padding-top:2rem;">
    <div id="detailWrap" class="detail-wrap">
      <!-- JS 依 ?id= 填入 -->
      <div class="detail-side">
        <div id="detailImg"></div>
      </div>
      <div class="detail-main">
        <h1 class="detail-name" id="detailName"></h1>
        <div id="detailPriceRow" class="product-price-row"></div>
        <div id="detailStock" class="stock-line"></div>

        <div class="detail-options" id="detailOptions" style="display:none;">
          <label>選擇規格／加購</label>
          <select id="detailOptionSel" class="form-control" style="max-width:320px;"></select>
        </div>

        <div id="detailQtyRow" style="display:none;margin:1rem 0;">
          <label style="color:var(--text-muted);font-size:.85rem;margin-right:.6rem;">數量</label>
          <input type="number" id="detailQty" class="qty-input" min="1" value="1">
        </div>

        <button class="btn-gold solid" id="detailAdd" style="margin:1rem 0;width:auto;">加入購物車</button>
        <div id="detailNote" style="color:var(--text-muted);font-size:.82rem;margin-top:.8rem;"></div>

        <ul class="detail-list" id="detailList"></ul>
      </div>
    </div>

    <div class="section-center" style="margin-top:3rem;">
      <a href="products.html" class="btn-outline">← 回結緣品總覽</a>
    </div>
  </div>
</div>

<div id="footer-placeholder"></div>

<script src="js/auth.js"></script>
<script src="js/products.js"></script>
<script src="js/cart.js"></script>
<script src="js/api.js"></script>
<script src="js/top-menu.js"></script>
<script src="js/auth-nav.js"></script>
<script src="js/footer.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  ISAYA_API.loadProducts().then(init);

  function init() {
  var params = new URLSearchParams(location.search);
  var id = params.get('id');
  var p = ISAYA.getProduct(id);

  if (!p) {
    document.getElementById('detailWrap').innerHTML =
      '<div class="cart-empty">找不到此品項。<br><br><a href="products.html" class="btn-gold" style="padding:.6rem 2rem;">回結緣品總覽</a></div>';
    return;
  }

  // 圖片：img + 占位成對，走 api.js 候選回退（檔案缺失 → 舊圖 → 占位符）
  var imgWrap = document.getElementById('detailImg');
  imgWrap.innerHTML =
    '<img class="detail-img" id="detailImgEl" src="" alt="' + p.name + '">' +
    '<div class="detail-img-ph" id="detailImgPh" style="display:none;">' + (p.type === 'service' ? '☸' : '◎') + '</div>';

  function rebindImg() {
    var imgEl = document.getElementById('detailImgEl');
    var phEl = document.getElementById('detailImgPh');
    if (window.ISAYA_API && ISAYA_API.bindPair) ISAYA_API.bindPair(imgEl, phEl, p, curOpt());
  }

  document.title = p.name + ' — 光圻靈的伊夏亞 isaya';
  document.getElementById('detailName').textContent = p.name;

  // 價格
  var priceRow = document.getElementById('detailPriceRow');
  if (p.consult) {
    priceRow.innerHTML = '<span class="tag-consult">洽詢價</span> ' +
      (p.price_note ? '<span class="product-note">' + p.price_note + '</span>' : '');
  } else if (!p.price) {
    priceRow.innerHTML = '<span class="product-price">依規格</span>';
  } else {
    priceRow.innerHTML = '<span class="product-price"><span class="cur">NT$</span>' + p.price + '</span> ' +
      (p.price_note ? '<span class="product-note">' + p.price_note + '</span>' : '');
  }

  document.getElementById('detailStock').textContent =
    (typeof p.stock === 'string' && p.stock) ? p.stock : '';

  // 選項
  var hasOpts = p.options && p.options.length > 1;
  if (hasOpts) {
    document.getElementById('detailOptions').style.display = 'block';
    var sel = document.getElementById('detailOptionSel');
    sel.innerHTML = p.options.map(function (o) {
      var label = o.label + (o.surcharge ? '（+' + o.surcharge + '）' : '');
      return '<option value="' + o.id + '">' + label + '</option>';
    }).join('');
    sel.onchange = function () { updateTotal(); rebindImg(); };
  } else {
    var baseOpt = p.options && p.options[0] ? p.options[0].id : '';
    window._curOpt = baseOpt;
  }

  // 數量（可調才顯示）
  if (p.multi_qty && p.consult === false) {
    document.getElementById('detailQtyRow').style.display = 'flex';
  }

  // 加購 / 數量即時加總
  var totalLine = document.getElementById('detailNote');
  function curOpt() {
    if (hasOpts) return document.getElementById('detailOptionSel').value;
    return window._curOpt || (p.options && p.options[0] ? p.options[0].id : '');
  }
  function updateTotal() {
    if (p.consult) {
      totalLine.textContent = '洽詢價項目：加入購物車送單後，由管理端回覆價格與檔期。';
      return;
    }
    var unit = ISAYA.lineUnitPrice(p, curOpt());
    var qtyEl = document.getElementById('detailQty');
    var qty = (qtyEl && p.multi_qty) ? Math.max(1, parseInt(qtyEl.value, 10) || 1) : 1;
    var opt = ISAYA.getOption(p, curOpt());
    var line = unit * qty;
    totalLine.textContent =
      (hasOpts && opt ? opt.label + '　' : '') +
      '單價 NT$' + unit + ' × ' + qty + ' = NT$' + line +
      (p.group_order ? '（成團後通知付款）' : '');
  }
  var qtyEl = document.getElementById('detailQty');
  if (qtyEl) qtyEl.oninput = updateTotal;
  updateTotal();

  // 明細清單
  document.getElementById('detailList').innerHTML =
    (p.detail || []).map(function (d) { return '<li>' + d + '</li>'; }).join('');

  // 加入購物車
  document.getElementById('detailAdd').onclick = function () {
    var optId = curOpt();
    var qty = (p.multi_qty && !p.consult) ? Math.max(1, parseInt((qtyEl ? qtyEl.value : '1'), 10) || 1) : 1;
    ISAYACart.add(p.id, optId, qty);
    isayaToast('已加入購物車：' + p.name + (p.group_order ? '（成團後通知付款）' : ''));
  };
  rebindImg(); // 首次依目前選項綁定圖片
  }
});
</script>
</body>
</html>
