<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>商品 — 光圻靈的伊夏亞 isaya</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
</head>
<body>

<nav id="top-nav"></nav>

<div class="page">
  <div class="section" style="padding-top:2rem;">
    <div class="page-loader" id="pageLoader"><div class="loader-ring"></div>載入中…</div>
    <div id="detailWrap" class="detail-wrap" style="display:none;">
      <!-- JS 依 ?id= 填入 -->
      <div class="detail-side">
        <div id="detailImg"></div>
      </div>
      <div class="detail-main">
        <h1 class="detail-name" id="detailName"></h1>
        <div id="detailPriceRow" class="product-price-row"></div>
        <div id="detailStock" class="stock-line"></div>
        <p class="detail-blurb" id="detailBlurb"></p>

        <div class="detail-options" id="detailOptions" style="display:none;">
          <label>選擇規格／加購</label>
          <select id="detailOptionSel" class="form-control" style="max-width:320px;"></select>
        </div>

        <div id="detailQtyRow" style="display:none;margin:1rem 0;">
          <label style="color:var(--text-muted);font-size:.95rem;margin-right:.6rem;">數量</label>
          <input type="number" id="detailQty" class="qty-input" min="1" value="1">
        </div>

        <button class="btn-gold solid" id="detailAdd" style="margin:1rem 0;width:auto;">加入購物車</button>
        <div id="detailNote" style="color:var(--text-muted);font-size:.95rem;margin-top:.8rem;"></div>
      </div>
    </div>

    <div id="fullStory" class="detail-story" style="display:none;"></div>

    <div class="section-center" style="margin-top:3rem;">
      <a href="products.html" class="btn-outline">← 回結緣品總覽</a>
    </div>
  </div>
</div>

<div id="footer-placeholder"></div>

<script src="js/auth.js"></script>
<script src="js/isaya-core.js"></script>
<script src="js/product-assets.js"></script>
<script src="js/cart.js"></script>
<script src="js/api.js"></script>
<script src="js/top-menu.js"></script>
<script src="js/auth-nav.js"></script>
<script src="js/footer.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  var bootId = new URLSearchParams(location.search).get('id');
  loadStory(bootId);                    // 長文獨立載入，不等商品清單
  ISAYA_API.loadProducts().then(function (res) { init(res); });

  // 長文載入：只 fetch articles/{id}.html（長文＝商品詳細介紹，已不寫價格；價格以頁面顯示為準）
  function loadStory(id) {
    var storyEl = document.getElementById('fullStory');
    if (!storyEl || !id) return;
    function sym() {
      var pp = (window.ISAYA && ISAYA.getProduct) ? ISAYA.getProduct(id) : null;
      return (pp && pp.type === 'service') ? '☸' : '◎';
    }
    function bindImg(im) {
      // 內文圖與上方圖廊同檔（多為快取命中），改 eager 避免 lazy 造成「圖好像不見了」的錯覺
      im.loading = 'eager';
      im.onerror = function () {
        var ph = document.createElement('div');
        ph.className = 'story-img-ph'; ph.textContent = sym();
        im.replaceWith(ph);
      };
    }
    function applyHTML(html) {
      var doc = new DOMParser().parseFromString(html, 'text/html');
      var story = doc.querySelector('.detail-story');
      if (!story) return false;
      // 先把每個節點搬進 fragment 並掛好 onerror，最後才插入 DOM：
      // 避免圖片在掛上 handler 之前就載入失敗，而留下一塊無聲的隱形空白。
      var frag = document.createDocumentFragment();
      Array.prototype.slice.call(story.children).forEach(function (el) {
        var ims = [];
        if (el.matches && el.matches('img.story-img')) ims.push(el);
        if (el.querySelectorAll) ims = ims.concat(Array.prototype.slice.call(el.querySelectorAll('img.story-img')));
        ims.forEach(bindImg);
        frag.appendChild(el);
      });
      storyEl.innerHTML = '';
      // 先顯示容器再插入：圖片若在 display:none 的容器內進 DOM，即使是 eager
      // 也會被延後到捲進視窗才載入（實測未捲動時只載入 5/15）。順序對調即可。
      storyEl.style.display = '';
      storyEl.appendChild(frag);
      return true;
    }
    fetch('articles/' + encodeURIComponent(id) + '.html')
      .then(function (r) { if (r.ok) return r.text(); throw new Error('no article'); })
      .then(applyHTML)
      .catch(function () { /* 無長文：不顯示 fullStory 區塊 */ });
  }

  function init(res) {
  var params = new URLSearchParams(location.search);
  var id = params.get('id');
  var p = ISAYA.getProduct(id);
  var loader = document.getElementById('pageLoader');
  function hideLoader() { if (loader) { loader.classList.add('done'); setTimeout(function () { loader.style.display = 'none'; }, 400); } }

  if (!res || !res.ok || !p) {
    // fail-closed：商品價格讀不到（GAS 掛／品項不存在）→ 不顯示可結帳內容、停用加購，絕不拿舊價
    document.getElementById('detailWrap').style.display = '';
    document.getElementById('detailWrap').innerHTML =
      '<div class="cart-empty">' +
      (p ? '商品資料暫無法載入，此品項暫時無法加購。<br><br>' : '找不到此品項。<br><br>') +
      '<a href="products.html" class="btn-gold" style="padding:.6rem 2rem;">回結緣品總覽</a></div>';
    hideLoader();
    return;
  }

  // 載入成功：隱藏動畫、顯示主體
  hideLoader();
  document.getElementById('detailWrap').style.display = '';

  // 一頁式圖文長文：由 DOMContentLoaded 內的 loadStory() 獨立載入 articles/{id}.html，
  // 不等商品清單（避免被 GAS 逾時拖慢）。長文＝商品詳細介紹（不寫價格）；價格一律以頁面顯示為準。

  // 圖片：主圖＋縮圖圖廊（走 api.js 候選回退：舍利編號圖 → 品項 img → 本機主圖 → 占位符）
  var imgWrap = document.getElementById('detailImg');
  imgWrap.innerHTML =
    '<img class="detail-img" id="detailImgEl" src="" alt="' + p.name + '">' +
    '<div class="detail-img-ph" id="detailImgPh" style="display:none;">' + (p.type === 'service' ? '☸' : '◎') + '</div>' +
    '<div class="detail-thumbs" id="detailThumbs"></div>';

  // 圖廊清單：舍利依編號切換 optionImgs；其餘用 imgs（主圖第一張）
  function galleryFor(opt) {
    if (p.optionImgs && p.optionImgs[opt]) return p.optionImgs[opt];
    if (p.imgs && p.imgs.length) return p.imgs;
    if (p.img) return [p.img];
    return [];
  }
  function setMain(src) {
    var imgEl = document.getElementById('detailImgEl');
    var phEl = document.getElementById('detailImgPh');
    imgEl.onerror = null;
    if (!src) { imgEl.style.display = 'none'; imgEl.removeAttribute('src'); phEl.style.display = ''; return; }
    phEl.style.display = 'none';
    imgEl.style.display = '';
    imgEl.onerror = function () { /* 單一候選失敗即交還 bindPair */ rebindImg(); };
    imgEl.src = src;
  }
  function rebindImg() {
    // 依目前主圖候選（api.js：舍利編號圖 → 品項 img → 本機舊圖 → 占位符）
    var imgEl = document.getElementById('detailImgEl');
    var phEl = document.getElementById('detailImgPh');
    if (window.ISAYA_API && ISAYA_API.bindPair) ISAYA_API.bindPair(imgEl, phEl, p, curOpt());
    // 縮圖圖廊
    var thumbs = document.getElementById('detailThumbs');
    var list = galleryFor(curOpt());
    var mainSrc = imgEl.getAttribute('src') || '';
    if (list.length > 1) {
      thumbs.style.display = '';
      thumbs.innerHTML = list.map(function (src) {
        return '<img class="thumb' + (src === mainSrc ? ' active' : '') + '" src="' + src + '" data-src="' + src + '" alt="">';
      }).join('');
    } else {
      thumbs.style.display = 'none'; thumbs.innerHTML = '';
    }
  }
  document.getElementById('detailThumbs').addEventListener('click', function (e) {
    var t = e.target.closest('.thumb');
    if (!t) return;
    document.querySelectorAll('#detailThumbs .thumb').forEach(function (x) { x.classList.remove('active'); });
    t.classList.add('active');
    setMain(t.dataset.src);
  });

  document.title = p.name + ' — 光圻靈的伊夏亞 isaya';
  document.getElementById('detailName').textContent = p.name;
  var blurbEl = document.getElementById('detailBlurb');
  if (blurbEl) blurbEl.textContent = p.blurb || '';

  // 價格
  var priceRow = document.getElementById('detailPriceRow');
  if (p.consult) {
    priceRow.innerHTML = '<span class="tag-consult">洽詢價</span> ' +
      (p.price_note ? '<span class="product-note">' + p.price_note + '</span>' : '');
  } else if (!p.price) {
    priceRow.innerHTML = '<span class="product-price">依規格</span>';
  } else {
    priceRow.innerHTML = '<span class="product-price"><span class="cur">NT$</span>' + p.price + '</span> ' +
      (p.price_note ? '<span class="product-note">' + p.price_note + '</span>' : '');
  }

  document.getElementById('detailStock').textContent =
    (typeof p.stock === 'string' && p.stock) ? p.stock : '';

  // 選項
  var hasOpts = p.options && p.options.length > 1;
  if (hasOpts) {
    document.getElementById('detailOptions').style.display = 'block';
    var sel = document.getElementById('detailOptionSel');
    sel.innerHTML = p.options.map(function (o) {
      var label = o.label + (o.surcharge ? '（+' + o.surcharge + '）' : '');
      return '<option value="' + o.id + '">' + label + '</option>';
    }).join('');
    sel.onchange = function () { updateTotal(); rebindImg(); };
  } else {
    var baseOpt = p.options && p.options[0] ? p.options[0].id : '';
    window._curOpt = baseOpt;
  }

  // 數量（可調才顯示）
  if (p.multi_qty && p.consult === false) {
    document.getElementById('detailQtyRow').style.display = 'flex';
  }

  // 加購 / 數量即時加總
  var totalLine = document.getElementById('detailNote');
  function curOpt() {
    if (hasOpts) return document.getElementById('detailOptionSel').value;
    return window._curOpt || (p.options && p.options[0] ? p.options[0].id : '');
  }
  function updateTotal() {
    if (p.consult) {
      totalLine.textContent = '洽詢價項目：加入購物車送單後，由管理端回覆價格與檔期。';
      return;
    }
    var unit = ISAYA.lineUnitPrice(p, curOpt());
    var qtyEl = document.getElementById('detailQty');
    var qty = (qtyEl && p.multi_qty) ? Math.max(1, parseInt(qtyEl.value, 10) || 1) : 1;
    var opt = ISAYA.getOption(p, curOpt());
    var line = unit * qty;
    totalLine.textContent =
      (hasOpts && opt ? opt.label + '　' : '') +
      '單價 NT$' + unit + ' × ' + qty + ' = NT$' + line +
      (p.group_order ? '（成團後通知付款）' : '');
  }
  var qtyEl = document.getElementById('detailQty');
  if (qtyEl) qtyEl.oninput = updateTotal;
  updateTotal();

  // 加入購物車
  document.getElementById('detailAdd').onclick = function () {
    var optId = curOpt();
    var qty = (p.multi_qty && !p.consult) ? Math.max(1, parseInt((qtyEl ? qtyEl.value : '1'), 10) || 1) : 1;
    ISAYACart.add(p.id, optId, qty);
    isayaToast('已加入購物車：' + p.name + (p.group_order ? '（成團後通知付款）' : ''));
  };
  rebindImg(); // 首次依目前選項綁定圖片
  }
});
</script>
</body>
</html>
